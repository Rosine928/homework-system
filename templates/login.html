{% extends 'base.html' %}
{% block content %}
<div class="auth-shell">
    <section class="auth-card">
        <div class="auth-title">
            <h1>登录知行课堂</h1>
            <p class="muted">课程作业与学习反馈</p>
        </div>
        <div class="auth-body">
            <form method="post" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="login-username">用户名</label>
                <input id="login-username" name="username" required maxlength="40" autocomplete="username" placeholder="请输入用户名">
                <label for="login-password">密码</label>
                <input id="login-password" type="password" name="password" required maxlength="128" autocomplete="current-password" placeholder="请输入密码">
                <p><button>登录</button></p>
            </form>
            <p class="muted">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
        </div>
    </section>
</div>
{% endblock %}
