{% extends 'base.html' %}
{% block content %}
<div class="auth-shell">
    <section class="auth-card">
        <div class="auth-title">
            <h1>创建账号</h1>
            <p class="muted">加入知行课堂</p>
        </div>
        <div class="auth-body">
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="register-username">用户名</label>
                <input id="register-username" name="username" required minlength="2" maxlength="40" value="{{ request.form.get('username','') }}" autocomplete="username">
                <label for="register-password">密码</label>
                <input id="register-password" type="password" name="password" required minlength="6" maxlength="128" autocomplete="new-password">
                <small>密码需为 6-128 位。</small>
                <label for="account-role">身份</label>
                <select id="account-role" name="role">
                    <option value="STUDENT">学生</option>
                    <option value="TEACHER" {% if request.form.get('role') == 'TEACHER' %}selected{% endif %}>教师</option>
                </select>
                <label for="real-name">姓名</label>
                <input id="real-name" name="real_name" maxlength="40" value="{{ request.form.get('real_name','') }}" autocomplete="name" required>
                <div class="student-field">
                    <label for="student-number">学号</label>
                    <input id="student-number" name="student_number" minlength="2" maxlength="32" pattern="[A-Za-z0-9_-]{2,32}" value="{{ request.form.get('student_number','') }}" required>
                    <small>2-32 位字母、数字、下划线或短横线；每个学号只能注册一次。</small>
                </div>
                <p><button>注册</button></p>
            </form>
            <p class="muted">已有账号？<a href="{{ url_for('login') }}">立即登录</a></p>
        </div>
    </section>
</div>
<script src="{{ url_for('static',filename='account.js') }}" defer></script>
{% endblock %}
