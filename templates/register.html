{% extends "base.html" %}
{% block title %}用户注册{% endblock %}

{% block content %}
<div class="card col-md-5 mx-auto shadow-sm mt-5">
    <div class="card-body p-4">
        <h3 class="text-center mb-4">用户注册</h3>
        
        <form method="post" action="/register">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" required placeholder="请输入用户名">
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required placeholder="请输入密码">
            </div>
            <div class="mb-3">
                <label class="form-label">角色身份</label>
                <select name="role" class="form-select">
                    <option value="STUDENT">学生</option>
                    <option value="TEACHER">老师</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">注 册</button>
            
            <div class="mt-3 text-center">
                <span class="text-muted">已有账号？</span>
                <a href="/login" class="text-decoration-none">去登录</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
