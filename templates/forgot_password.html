{% extends 'base.html' %}
{% block content %}
{% set reset_email = request.form.get('email', session.get('reset_email', '')) %}
<div class="auth-shell"><section class="auth-card">
    <div class="auth-title"><h1>找回密码</h1><p class="muted">通过已绑定邮箱接收验证码，设置新密码</p></div>
    <div class="auth-body">
        <form method="post" action="{{ url_for('reset_password_by_email') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="send-email">已绑定邮箱</label>
            <input id="send-email" type="email" name="email" required maxlength="254" autocomplete="email" placeholder="请输入已验证的邮箱地址" value="{{ reset_email }}">
            <p><button formaction="{{ url_for('send_password_email') }}" formnovalidate {% if not email_service_ready() %}disabled{% endif %}>发送验证码</button></p>
            <label for="email-code">邮箱验证码</label>
            <input id="email-code" name="email_code" required minlength="6" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" placeholder="6 位数字验证码">
            <small>验证码 10 分钟内有效；请检查垃圾邮件。发送间隔至少 60 秒。</small>
            <label for="email-password">新密码</label>
            <input id="email-password" type="password" name="new_password" required minlength="8" maxlength="128" autocomplete="new-password">
            <label for="email-confirm">确认新密码</label>
            <input id="email-confirm" type="password" name="confirm_password" required minlength="8" maxlength="128" autocomplete="new-password">
            <small>密码需为 8-128 位。重置后，所有旧登录会话与验证码同时失效。</small>
            <p><button>重置密码</button></p>
        </form>
        <p class="muted">还未绑定邮箱？能登录时请前往“个人资料 → 找回密码邮箱”绑定；已无法登录，请联系系统维护人员核实身份。</p>
        <p><a href="{{ url_for('login') }}">返回登录</a></p>
    </div>
</section></div>
{% endblock %}
